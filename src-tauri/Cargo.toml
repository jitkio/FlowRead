[package]
name = "flowread"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
default-run = "flowread"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "flowread_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-fs = "2.7.0"
epub = "2.1.5"
html2text = "0.17.1"
rusqlite = { version = "0.33.0", features = ["bundled"] }
uuid = { version = "1.15.1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "fs", "macros"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
base64 = "0.22"
regex = "1"
futures-util = { version = "0.3", default-features = false }
bytes = "1"

# 系统凭据库：必须显式启用 Windows 原生后端（Credential Manager），
# 否则 keyring 3.x 会退化为进程内 mock，重启后读不到已保存的 Token。
# 本应用只发布 Windows 桌面版；其它平台构建不在本轮范围内。
keyring = { version = "3", features = ["windows-native"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
